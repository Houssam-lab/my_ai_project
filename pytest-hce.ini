; Dedicated pytest config for the bounded Hard Currency Engine quality gate
; (.github/workflows/hard-currency-engine.yml) — used via `-c pytest-hce.ini`.
;
; WHY THIS FILE EXISTS (failure analysis, 2026-10-03):
; The HCE workflow deliberately installs only a pinned test runner
; (pytest==8.3.5 + pytest-cov==6.0.0) and NO application dependencies —
; that minimalism is the gate's isolation guarantee. But pytest < 9 resolves
; `filterwarnings` categories EAGERLY at config parse, and the repo-root
; `pytest.ini` names `sqlalchemy.exc.SAWarning` and
; `pydantic.warnings.UnsupportedFieldAttributeWarning`. Result: the gate
; crashed with `ModuleNotFoundError: No module named 'sqlalchemy'` (exit 4)
; before collecting a single test — the very commit that pinned pytest "for
; determinism" turned `main` red (run 37085541486, job hce-quality).
; `--confcutdir` isolates conftest files, NOT ini config; this file closes
; that hole. The monolith's `pytest.ini` is intentionally untouched.
;
; INVARIANT: this config must never name a warning category from a package
; that the HCE workflow does not install.
[pytest]
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
