# ── live-e2e (D-266 · نطاقٌ مُصحَّح في ISS-199) ────────────────────────────────
#
# النطاق الحقيقي: `workflow_dispatch` **و** `workflow_call`. و`ci.yml` يستدعيها في كل
# دفعة باسم `live-e2e-required`، وهي **داخل** `required-ci` (في `needs` وفي سلسلة
# `isValid` معاً). ⚠️ كان هذا الرأس يقول نقيضَ ذلك حتى 2026-08-30: أضافت `3176fe6`
# الاستدعاء والوصل و`diff`ها على هذا الملفّ يبدأ عند `@@ -25` — أي أنّها **لم تلمس
# الرأس**، فبقي وعدٌ يفارق تنفيذه. وهو صنف ISS-198 نفسه، وقاعدة D-188 تحكمه.
#
# وماذا يحجب وماذا يُبلِّغ (ISS-199):
#   • يحجب **عقدَنا** — إطارٌ نهائيّ واحد لكل دور (§6.5) · لا نصّ نظامٍ يصل الطالب
#     (D-117/D-229) · لا دورَ صامت · لا مكوّنٌ لا تعرف الواجهة رسمه · ولا يُشغَّل
#     أعمى بلا أسرار.
#   • يُبلِّغ ولا يحجب ما كان **مؤجَّلاً بتصريح** في `scripts/e2e/deferred_findings.py`
#     — بلاغٌ 🔴 مفتوحٌ بقرارٍ مكتوبٍ بتأجيله (اليوم: ISS-150 وحده). ⛔ والتأجيل ليس
#     إخفاءً: المخالفة تُطبَع بنصّها في كل تشغيل، ويتغيّر رمز الخروج وحده. تحرس
#     السجلَّ `check_e2e_deferred_findings.py`، فبلاغٌ أُغلق وبقي مؤجَّلاً ⇒ CI أحمر.
#
# ولماذا لا تُترَك حاجبةً على كل شيء: بوّابةٌ مُوجَّهةٌ إلى عطبٍ قرّر المستودع تأجيله
# لا تحرس ضدّ انحدار — تمنع **كلّ** دفعة بالبناء. وهو ما وقع فعلاً: خمسة تشغيلاتٍ
# حمراء متتالية على `main`. وذلك هو الخطر الذي حذّر منه رأس `repo-sync.yml` حرفيّاً
# («failing every commit … trains people to ignore the job») ووقع في ISS-197.
#
# قاعدة البيانات (Phase 1 · W6 · 2026-09-29): الرحلة تعمل على **Postgres مؤقّتة** داخل
# العدّاء (`services.postgres` · pgvector · Postgres 17 مثل الإنتاج) تُنشأ لكل تشغيل
# وتُمحى بعده. كانت تكتب في **قاعدة الإنتاج** بحساب طالبٍ حقيقي حتى صار 96.4٪ من
# رسائل الإنتاج رسائلَ CI (ISS-203) — بياناتُ قاصرين مختلطة باختبار. والطالب يُسجَّل
# عشوائياً في كل تشغيل، فلا كلمة مرور حسابٍ حقيقي في الأسرار ولا في السجلّات.
#
# ⛔ **لا يُشغَّل بلا أسرارٍ مضبوطة.** وظيفةٌ تمرّ لأن السرّ غائب هي بالضبط «الصمت
# يُقرأ نجاحاً» الذي يحظره D-207 — فالخطوة الأولى تفشل صراحةً وتسمّي السرّ الناقص.
#
# الأسرار المطلوبة (تُضبَط من إعدادات المستودع):
#   OPENROUTER_API_KEY · TAVILY_API_KEY · SECRET_KEY · HONCHO_API_KEY
name: live-e2e

on:
  workflow_dispatch:
    inputs:
      matrix_only:
        description: "شغّل مصفوفة «يجيب على كل سؤال» وحدها (بلا رحلة الطالب)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      matrix_only:
        description: "شغّل مصفوفة الإجابة وحدها (للاستخدام اليدوي فقط)"
        type: boolean
        required: false
        default: false
    secrets:
      OPENROUTER_API_KEY:
        required: true
      TAVILY_API_KEY:
        required: true
      SECRET_KEY:
        required: true
      HONCHO_API_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: live-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-e2e:
    name: live-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cogniforge_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cogniforge_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # قاعدةٌ مؤقّتة لا سرّ: لا تحمل إلّا ما تكتبه هذه الرحلة، وتُمحى مع العدّاء.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cogniforge_e2e
      APP_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cogniforge_e2e
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      # DIAG_EMAIL/DIAG_PASSWORD (الأسماء التي تقرأها سكربتات الاختبار الحيّ) تُضبط
      # في خطوة «Register an ephemeral E2E student» — حسابٌ عشوائي لكل تشغيل.
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      # D-268/D-269 — طبقة الهوية المعرفية المحيطة. اختياريّ عمداً: غيابه يجعل
      # المسبار يُبلِّغ `not_configured` ولا يُفشِل الرحلة، لأنه ليس على مسار
      # إجابة الطالب. ولذلك هو **خارج** حارس «Refuse to run blind» أدناه —
      # الحارس لأسرارٍ بلا واحدٍ منها تصير الوظيفة كذباً، لا لكل سرٍّ مُعلَن.
      HONCHO_API_KEY: ${{ secrets.HONCHO_API_KEY }}
      ENVIRONMENT: development
      LLM_MOCK_MODE: "0"
      # D-280: gpt-oss-20b:free was removed from the public catalog (404).
      # Use a currently listed, previously Arabic-validated free model for this
      # live probe, and append a current free-tier recovery slot. The probe still
      # fails closed if the model cannot answer the full matrix.
      OPENROUTER_PRIMARY_MODEL: google/gemma-4-31b-it:free
      OPENROUTER_EXTRA_MODELS: nvidia/nemotron-3.5-lightning:free
      # This job is named full-stack: it must traverse monolith → orchestrator →
      # StateGraph → LLM.  REQUIRE_ORCHESTRATOR=0 previously let every probe pass
      # through the monolith's local fallback while the real graph could be dead.
      REQUIRE_ORCHESTRATOR: "1"
      ORCHESTRATOR_SERVICE_URL: http://127.0.0.1:8006
      ORCHESTRATOR_CHAT_ENDPOINT: state_graph
      ORCHESTRATOR_LOCAL_FALLBACK_ENABLED: "0"
      E2E_BACKEND: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7

      # الصمت لا يُقرأ نجاحاً: سرٌّ ناقص ⇒ فشلٌ صريح يسمّيه، لا تخطٍّ صامت.
      - name: "Refuse to run blind"
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in OPENROUTER_API_KEY TAVILY_API_KEY SECRET_KEY HONCHO_API_KEY; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::أسرارٌ ناقصة: ${missing[*]} — اضبطها في إعدادات المستودع."
            exit 1
          fi
          echo "✅ كل الأسرار المطلوبة حاضرة."

      # الإنتاج Postgres 17 + pgvector؛ جدول التمارين يحمل عمود `vector(1024)`.
      - name: Enable pgvector in the ephemeral database
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d cogniforge_e2e \
            -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Normalize Tavily secret without exposing it
        shell: bash
        run: |
          set -euo pipefail
          raw="${TAVILY_API_KEY:-}"
          if [[ "$raw" == *"tavilyApiKey="* ]]; then
            raw="${raw##*tavilyApiKey=}"
            raw="${raw%%&*}"
          fi
          [ -n "$raw" ] || { echo '::error::TAVILY_API_KEY is empty after normalization'; exit 1; }
          echo "::add-mask::$raw"
          echo "TAVILY_API_KEY=$raw" >> "$GITHUB_ENV"

      # D-298: الـ orchestrator لا يقرأ إلا `ORCHESTRATOR_DATABASE_URL` (config.py ·
      # validation_alias)، وهذه الوظيفة كانت تضبط `DATABASE_URL` وحده. فكان يتّصل
      # بالافتراضي `localhost:5432/orchestrator_db`، وتموت كل رسالة بـ`PoolTimeout` ثمّ
      # 500 — و`/health` يقول `ok`. أُعيد إنتاجه محلياً بالبيئة نفسها حرفياً.
      # التحويل نفسه الذي يُقلع به `.devcontainer/supervisor.sh` منذ D-178: سائق asyncpg،
      # و6543 ⇒ 5432 (مجمّع الجلسة)، وحذف sslmode (psycopg يعيد `sslmode=require`).
      - name: Derive the orchestrator database URL (D-298)
        shell: bash
        run: |
          set -euo pipefail
          url="${DATABASE_URL}"
          url="${url/postgres:\/\//postgresql://}"
          url="${url/postgresql:\/\//postgresql+asyncpg://}"
          url="${url/postgresql+psycopg2:\/\//postgresql+asyncpg://}"
          url="$(printf '%s' "$url" | sed 's/:6543\//:5432\//' | sed 's/[?&]sslmode=[^&]*//' | sed 's/[?&]ssl=[^&]*//')"
          # الحاوية المؤقّتة بلا TLS، ومجمّع psycopg في الـorchestrator يفرض
          # `sslmode=require` حين يغيب (`core/database.py:_build_psycopg_conninfo`) ⇒
          # `database: unreachable`. أُعيد إنتاجه حياً على Postgres محلية قبل هذا السطر.
          url="${url}?sslmode=disable"
          echo "ORCHESTRATOR_DATABASE_URL=$url" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      # D-288: اسأل الكتالوج الحيّ قبل أن تُقلع الرحلة. خطأ المزوّد (404/402) كان يهبط
      # بكل ردود الطالب إلى رسالة اعتذار واحدة في أقل من ثانية، والحارس الأخضر
      # (test_ai_config) لا يراه لأنه يفرض PRIMARY بالقوة. المسبار يقرأ السلسلة كما يقرأها
      # الدماغان — تجاوز المشغِّل ثم الذيل ثم OPENROUTER_EXTRA_MODELS — فيسلّك ادّعاء D-280
      # («ذيل التعافي مثبَّت») أخيراً.
      # والفارق المُتعمَّد (دَينُ ISS-199): الموتُ **المقطوعُ به** يُفشِل، والعَمى (شبكة · 429 ·
      # 5xx) يُبلَّغ ولا يُفشِل — بوّابةٌ تُحمِّر CI لانقطاعٍ لا تراه تُعلِّم الجميع تجاهلها.
      # من يريد رفض التشغيل بلا رؤية يشغّل --strict. والمفتاح: 401 خطأٌ قاطع، أمّا 403
      # فسؤالٌ لجدارٍ أماميّ لا لمفاتيحنا — تحذيرٌ، واليقينُ في أول استدلالٍ حقيقيّ.
      - name: "Live model registry probe (D-288)"
        run: |
          set -euo pipefail
          rc=0
          python scripts/verify_model_registry_live.py --check-key 2>&1 \
            | tee /tmp/registry-probe.txt || rc="${PIPESTATUS[0]}"
          if grep -q "لا حكم" /tmp/registry-probe.txt; then
            echo "::warning::سجلّ النماذج لم يُقرأ من هذا المشغِّل — لا حكم، ولا خُضرةَ تُصدَّق."
          fi
          if [ "$rc" -ne 0 ]; then
            # سِجلّاتُ هذا المشغِّل لا تُقرأ من هنا (الواجهةُ المؤجَّرة تُرجع EOF)، فعلامةُ
            # الفشل يجب أن تحمل سببَها بنفسها: وإلّا كان «exit code 1» وحده يُخمَّن ساعةً كاملة.
            reason="$(grep -E '^(❌|⚠️)' /tmp/registry-probe.txt | head -n 3 | tr '\n' ' ')"
            printf '::error::المسبار خرج %s — %s\n' "$rc" "${reason:0:700}"
            exit "$rc"
          fi

      # Catalog presence is not generation. Invoke today's free text models with
      # the same key, then boot the graph with the first model that returned real
      # content. This also leaves a machine-readable experiment artifact.
      - name: "Invoke current OpenRouter free models"
        shell: bash
        run: |
          set -o pipefail
          rc=0
          python scripts/e2e/probe_openrouter_free_models.py \
            --limit 6 --reserve 20 --timeout 35 --github-env "$GITHUB_ENV" \
            --json-output /tmp/openrouter-free-probe.json \
            2>&1 | tee /tmp/openrouter-free-probe.log || rc="${PIPESTATUS[0]}"
          summary="$(tail -n 8 /tmp/openrouter-free-probe.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=No working OpenRouter free model::${summary:0:4000}"
            exit "$rc"
          fi
          echo "::notice title=OpenRouter free-model experiment::${summary:0:4000}"

      - name: Upload free-model experiment
        uses: actions/upload-artifact@v7
        with:
          name: openrouter-free-model-probe
          path: /tmp/openrouter-free-probe.json
          retention-days: 7

      - name: Boot the real StateGraph orchestrator against the ephemeral Postgres
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m uvicorn microservices.orchestrator_service.main:app \
            --host 127.0.0.1 --port 8006 > /tmp/orchestrator.log 2>&1 &
          ready=0
          for _ in $(seq 1 60); do
            if curl -sf --max-time 5 http://127.0.0.1:8006/health > /tmp/orchestrator-health.json; then
              ready=1
              break
            fi
            sleep 3
          done
          test "$ready" = 1 || { echo '::error::orchestrator لم يقلع'; tail -n 120 /tmp/orchestrator.log; exit 1; }
          cat /tmp/orchestrator-health.json
          # Import/HTTP health is insufficient: the chat endpoint requires the
          # compiled graph stored on app.state.  Fail before the journey if absent.
          python - <<'PY'
          import json, sys
          h = json.load(open('/tmp/orchestrator-health.json'))
          # D-298: `database` = مجمّع الدردشة يجيب فعلاً — لا يُكتفى بوجود الرسم.
          if (
              h.get('status') != 'ok'
              or h.get('graph_ready') is not True
              or h.get('database') == 'unreachable'
          ):
              sys.exit(f"::error::orchestrator/graph/database غير صالح: {h}")
          print(f"✅ orchestrator graph_ready=true database={h.get('database')}")
          PY

      - name: Boot the monolith against the ephemeral Postgres
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/backend.log 2>&1 &
          ready=0
          for _ in $(seq 1 60); do
            if curl -sf --max-time 5 http://127.0.0.1:8000/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 3
          done
          test "$ready" = 1 || { echo '::error::monolith لم يقلع'; tail -n 120 /tmp/backend.log; exit 1; }
          # `/health` صادقٌ أو لا شيء (D-245): نقرأ الجسم لا وجود العملية.
          cat /tmp/health.json
          python -c "import json,sys;h=json.load(open('/tmp/health.json'));bad=[k for k in ('application','database') if h.get(k)!='ok'];sys.exit('::error::/health غير صادق: '+str({k:h.get(k) for k in bad})) if bad else print('✅ /health صادق: application=ok database=ok')"

      # حسابٌ عشوائي لكل تشغيل على القاعدة المؤقّتة: لا بيانات دخولٍ حقيقية في الأسرار.
      - name: Register an ephemeral E2E student
        shell: bash
        run: |
          set -euo pipefail
          email="e2e.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.$(openssl rand -hex 4)@example.com"
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          body="$(python -c 'import json,sys; print(json.dumps({"full_name": "CI E2E Student", "email": sys.argv[1], "password": sys.argv[2]}))' "$email" "$password")"
          code="$(curl -s -o /tmp/register.json -w '%{http_code}' -X POST \
            http://127.0.0.1:8000/api/security/register \
            -H 'Content-Type: application/json' -d "$body")"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::تسجيل الطالب المؤقّت فشل (HTTP $code): $(head -c 400 /tmp/register.json)"
            exit 1
          fi
          echo "DIAG_EMAIL=$email" >> "$GITHUB_ENV"
          echo "DIAG_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "✅ طالبٌ مؤقّت مسجَّل (HTTP $code)"

      # D-269: الساق الثالثة من البرهان الثلاثي للطبقة الخامسة. `--require` عمداً:
      # المالك ضبط السرّ بهذا الاسم، فغيابُه هنا يعني اسماً خاطئاً لا طبقةً اختيارية
      # — والصمت لا يُقرأ نجاحاً (D-207). ⛔ ولا بيانات طالبٍ في هذا النداء.
      - name: "Ambient identity layer live probe (D-269)"
        run: python scripts/e2e/honcho_live_probe.py --require

      - name: "Universal answerability matrix (D-266 · ISS-159)"
        shell: bash
        run: |
          # لا نكتفي بـ exit 1 مبهم: قناة سجلات Actions الخارجية غير قابلة للقراءة
          # دائماً من بيئات التحقيق. ننشر خلاصة المصفوفة نفسها كـ check annotation
          # قابلة للاسترجاع عبر GitHub API، من دون أسرار أو أجسام HTTP خام.
          set -o pipefail
          rc=0
          python scripts/e2e/universal_answerability_live.py --base http://127.0.0.1:8000 \
            2>&1 | tee /tmp/answerability-matrix.log || rc="${PIPESTATUS[0]}"
          if [ "$rc" -ne 0 ]; then
            summary="$(grep -E '^(أدوار:|   •|❌|⚠️)' /tmp/answerability-matrix.log \
              | tail -n 20 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            [ -n "$summary" ] || summary="المصفوفة خرجت $rc بلا خلاصة مقروءة"
            echo "::error title=E2E answerability failed::${summary:0:4000}"
            exit "$rc"
          fi

      - name: "Student journey (D-232)"
        if: ${{ !inputs.matrix_only }}
        run: |
          python scripts/e2e/live_student_journey.py \
            --base http://127.0.0.1:8000 \
            --email "$DIAG_EMAIL" --password "$DIAG_PASSWORD"

      - name: "Runtime logs (always — a green run still owes graph evidence)"
        if: always()
        # `if: always()` تعني أنّ هذه الخطوة ستُجرى حتى بعد موت الرحلة مبكراً — فحيث
        # لا يوجد ملفٌّ بعدُ يجب أن يقول «لا دليل» لا أن يُخرج 1 ويُضيف سبباً كاذباً.
        run: |
          echo '=== orchestrator ==='
          if [ -f /tmp/orchestrator.log ]; then
            tail -n 160 /tmp/orchestrator.log
          else
            echo "::warning::لا /tmp/orchestrator.log — ماتت الرحلة قبل إقلاع الرسم."
          fi
          echo '=== monolith ==='
          if [ -f /tmp/backend.log ]; then
            tail -n 120 /tmp/backend.log
          else
            echo "::warning::لا /tmp/backend.log — ماتت الرحلة قبل إقلاع الخادم؛ السبب في الخطوات أعلاه."
          fi
          # بصمة تشخيصية صغيرة في check annotations: تُثبت هل وصل السؤال إلى
          # PRE-INVOKE، وهل خرج provider_error/terminal error، حتى إذا تعذّر تنزيل
          # ملف logs من blob storage. لا نطبع tokens أو headers أو DATABASE_URL.
          if [ -f /tmp/orchestrator.log ]; then
            diagnostic="$(grep -E 'PRE-INVOKE|provider_error|LLM_PROVIDER_UNAVAILABLE|all models|AI stream:|served by model|LangGraph streaming failure|PoolTimeout|health: database|rejected by provider' \
              /tmp/orchestrator.log | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            if [ -n "$diagnostic" ]; then
              echo "::notice title=E2E graph diagnostic::${diagnostic:0:4000}"
            else
              echo "::warning title=E2E graph diagnostic::لا توجد بصمة PRE-INVOKE أو LLM في آخر سجل orchestrator"
            fi
          fi
